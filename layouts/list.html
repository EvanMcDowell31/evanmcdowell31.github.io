{{ define "main" }}
<header class="page-head">
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
</header>
{{ if .Data.Terms }}
<ul class="chips chips-lg">
  {{ range .Data.Terms.ByCount }}<li><a href="{{ .Page.RelPermalink }}">#{{ .Page.LinkTitle }} <span>{{ .Count }}</span></a></li>{{ end }}
</ul>
{{ else }}
<ul class="story-list">
  {{ range .Pages }}{{ partial "story-row.html" . }}{{ end }}
</ul>
{{ end }}
{{ end }}
